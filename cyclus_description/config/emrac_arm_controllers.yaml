# File: emrac_arm_controllers.yaml
# Purpose: Standalone EMRAC arm controller definitions for the cyclus_description package.
# Author: BARGAVAN R
# Contact: bargavanr01@gmail.com
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: position_controllers/JointGroupPositionController

arm_position_controller:
  ros__parameters:
    joints:
      - base_to_lift_plate_carrier
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
